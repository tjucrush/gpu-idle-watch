name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - downloads/GPU-Idle-Watch.exe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish the portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-Item -LiteralPath 'downloads/GPU-Idle-Watch.exe'
          $version = $asset.VersionInfo
          $tag = 'v{0}.{1}.{2}' -f $version.FileMajorPart, $version.FileMinorPart, $version.FileBuildPart
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash
          $notes = "下载 **GPU-Idle-Watch.exe**。空闲显卡提醒默认显示在右上角，也可以选择另外三个角。软件会记住你的选择。"
          $notes += "`n`nSHA-256: $digest"
          gh release create $tag $asset.FullName --target $env:GITHUB_SHA --title "$tag · 单文件 Windows 版" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
